    <circle cx="320" cy="260" r="2"/>
    <circle cx="360" cy="280" r="2"/>
    <circle cx="400" cy="260" r="2"/>
    <circle cx="440" cy="280" r="2"/>
    <circle cx="160" cy="320" r="2"/>
