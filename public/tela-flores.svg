  <!-- Hojas decorativas -->
  <g opacity="0.5">
    <path d="M250 230 C240 235 238 245 242 255 C248 250 252 240 250 230 Z" fill="#5a8a3e"/>
    <path d="M340 230 C350 235 352 245 348 255 C342 250 338 240 340 230 Z" fill="#5a8a3e"/>
    <path d="M230 360 C220 365 218 375 222 385 C228 380 232 370 230 360 Z" fill="#5a8a3e"/>
    <path d="M370 370 C380 375 382 385 378 395 C372 390 368 380 370 370 Z" fill="#5a8a3e"/>
    <path d="M150 280 C142 285 140 295 144 305 C150 300 154 290 150 280 Z" fill="#5a8a3e"/>
    <path d="M450 300 C442 305 440 315 444 325 C450 320 454 310 450 300 Z" fill="#5a8a3e"/>
