  <!-- Esquina doblada superior izquierda -->
  <path d="M120 160 L160 160 L120 200 Z" fill="#e0d0b0" opacity="0.8"/>
  <path d="M120 160 L160 160 L150 170 L130 170 L120 190 Z" fill="#d4c4a0" opacity="0.5"/>

  <!-- Esquina doblada inferior derecha -->
  <path d="M480 460 L440 475 L480 475 Z" fill="#e0d0b0" opacity="0.8"/>
  <path d="M460 475 L480 475 L480 460 Z" fill="#d4c4a0" opacity="0.6"/>

  <!-- Brillo de cera (efecto satinado) -->
  <path d="M140 180 L140 460 Q140 468 148 470 L160 470 L160 180 Z" fill="#ffffff" opacity="0.12"/>
  <path d="M440 180 L440 460 L430 460 L430 180 Z" fill="#ffffff" opacity="0.06"/>

  <!-- Etiqueta -->
  <rect x="240" y="495" width="120" height="30" rx="6" fill="#fff9ef" stroke="#c9a84a" stroke-width="1"/>
  <text x="300" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3a5a2e">TELA ENCERADA 10×10</text>
</svg>
