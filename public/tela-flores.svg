    <circle cx="440" cy="340" r="2"/>
    <circle cx="160" cy="380" r="2"/>
    <circle cx="200" cy="400" r="2"/>
    <circle cx="240" cy="380" r="2"/>
    <circle cx="280" cy="400" r="2"/>
    <circle cx="320" cy="380" r="2"/>
    <circle cx="360" cy="400" r="2"/>
    <circle cx="400" cy="380" r="2"/>
    <circle cx="440" cy="400" r="2"/>
    <circle cx="160" cy="440" r="2"/>
    <circle cx="200" cy="430" r="2"/>
    <circle cx="240" cy="440" r="2"/>
