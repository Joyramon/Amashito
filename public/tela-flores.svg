    <circle cx="13" cy="-7" r="11" fill="#c4a8e8" opacity="0.85"/>
    <circle cx="14" cy="8" r="11" fill="#c4a8e8" opacity="0.85"/>
    <circle cx="-14" cy="8" r="11" fill="#c4a8e8" opacity="0.85"/>
