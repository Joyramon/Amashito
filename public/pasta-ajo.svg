<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo suave -->
  <rect width="600" height="600" fill="#f5f0e6"/>

  <!-- Sombra del tarro -->
  <ellipse cx="300" cy="540" rx="130" ry="18" fill="#00000018"/>

  <!-- Tarro de vidrio -->
  <!-- Cuerpo del tarro -->
  <path d="M210 200 L210 500 Q210 520 230 520 L370 520 Q390 520 390 500 L390 200 Z" fill="#e8f0ea" opacity="0.55" stroke="#b8d4be" stroke-width="2"/>
  <!-- Brillo del vidrio lado izquierdo -->
  <path d="M225 220 L225 490 Q225 502 232 505 L240 505 L240 220 Z" fill="#ffffff" opacity="0.35"/>
  <!-- Brillo del vidrio lado derecho -->
  <path d="M370 240 L370 490 L360 490 L360 240 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Contenido: pasta de ajo (color crema dorado) -->
  <path d="M220 270 L220 495 Q220 512 234 512 L366 512 Q380 512 380 495 L380 270 Z" fill="#e8d5a8"/>
  <!-- Textura de la pasta - manchas de ajo -->
  <circle cx="265" cy="320" r="6" fill="#d4b87a" opacity="0.7"/>
  <circle cx="320" cy="305" r="5" fill="#d4b87a" opacity="0.6"/>
  <circle cx="290" cy="380" r="7" fill="#d4b87a" opacity="0.65"/>
  <circle cx="340" cy="360" r="5" fill="#d4b87a" opacity="0.7"/>
  <circle cx="250" cy="430" r="6" fill="#d4b87a" opacity="0.6"/>
  <circle cx="310" cy="420" r="5" fill="#d4b87a" opacity="0.7"/>
  <circle cx="355" cy="450" r="6" fill="#d4b87a" opacity="0.65"/>
  <circle cx="275" cy="470" r="5" fill="#d4b87a" opacity="0.6"/>

  <!-- Especias dispersas (pimienta, orégano) -->
  <ellipse cx="280" cy="340" rx="3" ry="2" fill="#5c4a2e"/>
  <ellipse cx="335" cy="395" rx="3" ry="2" fill="#5c4a2e"/>
  <ellipse cx="300" cy="455" rx="3" ry="2" fill="#5c4a2e"/>
  <ellipse cx="340" cy="330" rx="2" ry="3" fill="#3d6b2e"/>
  <ellipse cx="260" cy="390" rx="2" ry="3" fill="#3d6b2e"/>
  <ellipse cx="320" cy="475" rx="2" ry="3" fill="#3d6b2e"/>

  <!-- Dientes de ajo visibles en la superficie -->
  <ellipse cx="285" cy="285" rx="14" ry="10" fill="#f5ead0" opacity="0.8"/>
  <ellipse cx="285" cy="285" rx="8" ry="6" fill="#e8d5a8" opacity="0.5"/>
  <ellipse cx="345" cy="290" rx="12" ry="9" fill="#f5ead0" opacity="0.7"/>
  <ellipse cx="345" cy="290" rx="7" ry="5" fill="#e8d5a8" opacity="0.5"/>

  <!-- Superficie de la pasta (línea superior) -->
  <ellipse cx="300" cy="270" rx="80" ry="12" fill="#e8d5a8" opacity="0.9"/>
  <ellipse cx="300" cy="268" rx="80" ry="8" fill="#f0e0b8" opacity="0.6"/>

  <!-- Boca del tarro -->
  <rect x="215" y="175" width="170" height="30" rx="4" fill="#d6e6db" opacity="0.6" stroke="#b8d4be" stroke-width="2"/>
  <!-- Cuello del tarro -->
  <path d="M225 175 L225 200 L375 200 L375 175 Z" fill="#e8f0ea" opacity="0.45"/>

  <!-- Tapa metálica -->
  <rect x="205" y="150" width="190" height="30" rx="6" fill="#c9a84a"/>
  <rect x="205" y="150" width="190" height="12" rx="6" fill="#d4b85a"/>
  <rect x="205" y="162" width="190" height="18" rx="0" fill="#b89a3a"/>

  <!-- Lazo rojo -->
  <!-- Bucle izquierdo -->
  <path d="M300 130 C260 100 230 105 235 140 C238 165 270 160 300 145 Z" fill="#d62828"/>
  <path d="M300 130 C268 110 245 115 248 140 C250 158 272 155 300 148 Z" fill="#e63939" opacity="0.8"/>
  <!-- Bucle derecho -->
  <path d="M300 130 C340 100 370 105 365 140 C362 165 330 160 300 145 Z" fill="#d62828"/>
  <path d="M300 130 C332 110 355 115 352 140 C350 158 328 155 300 148 Z" fill="#e63939" opacity="0.8"/>
  <!-- Nudo central -->
  <ellipse cx="300" cy="142" rx="16" ry="14" fill="#d62828"/>
  <ellipse cx="300" cy="140" rx="12" ry="10" fill="#e63939" opacity="0.7"/>
  <!-- Colas del lazo -->
  <path d="M292 156 L280 200 L290 198 L296 158 Z" fill="#d62828"/>
  <path d="M308 156 L320 200 L310 198 L304 158 Z" fill="#d62828"/>
  <path d="M286 175 L282 195 L288 194 Z" fill="#b51d1d" opacity="0.6"/>
  <path d="M314 175 L318 195 L312 194 Z" fill="#b51d1d" opacity="0.6"/>

  <!-- Etiqueta -->
  <rect x="245" y="340" width="110" height="70" rx="8" fill="#fff9ef" stroke="#c9a84a" stroke-width="1.5"/>
  <text x="300" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3a5a2e">PASTA DE</text>
  <text x="300" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3a5a2e">AJO</text>
  <text x="300" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8a7a5e">ARTESANAL</text>
  <!-- Pequeño chile decorativo en etiqueta -->
  <path d="M300 405 C297 406 296 409 296 412 C296 415 297 418 298 421 C299 423 300 424 300 425 C300 424 301 423 302 421 C303 418 304 415 304 412 C304 409 303 406 300 405 Z" fill="#3a5a2e"/>

  <!-- Dientes de ajo decorativos alrededor -->
  <g opacity="0.5">
    <ellipse cx="130" cy="350" rx="22" ry="16" fill="#f5ead0" transform="rotate(25 130 350)"/>
    <ellipse cx="130" cy="350" rx="14" ry="10" fill="#e8d5a8" transform="rotate(25 130 350)"/>
    <ellipse cx="480" cy="300" rx="20" ry="14" fill="#f5ead0" transform="rotate(-15 480 300)"/>
    <ellipse cx="480" cy="300" rx="12" ry="8" fill="#e8d5a8" transform="rotate(-15 480 300)"/>
  </g>
</svg>
